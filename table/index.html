<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rose Hernandez-Bullock's Schedule</title>
    <style>
        body {
            font-size: 30px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            background-color: rgb(253, 234, 184);
        }

        td,
        th {
            border: 1px solid gray;
            padding: 20px;
        }

        table {
            border-collapse: none;
        }


        .roundedTable {
            border-radius: 6px 6px 6px 6px;
            border: 1px solid #000000;
            border-spacing: 0;
            width: 900px;
        }

        .roundedTable tr:first-child td:first-child {
            border-top-left-radius: 0px;
        }

        .roundedTable tr:first-child td:last-child {
            border-top-right-radius: 10px;
        }

        .roundedTable tr:last-child td:first-child {
            border-bottom-left-radius: 10px;
        }

        .roundedTable tr:last-child td:last-child {
            border-bottom-right-radius: 10px;
        }

        /* optional setting to pad the table cells */
        .roundedTable th,
        td {
            padding: 10px 15px 10px 15px;
        }

        .top {
            background-color: #de940a;
            color: #fffffe;
            font-weight: bold;
        }

        table {
            width: auto;
            margin: 0 auto;
        }
    </style>
</head>

<body>
    <header>
        <center>
            <h1>Rose Hernandez-Bullock's Schedule</h1>
        </center>
    </header>
    <table class="roundedTable">
        <caption>College Course</caption>
        <tbody>
            <tr class="top">
                <td>Course Number</td>
                <td>Course Name</td>
                <td>Professor</td>
            </tr>
            <tr>
                <td>CAWT 170</td>
                <td>Website Development I</td>
                <td>Marty Pfieffer</td>
            </tr>
            <tr>
                <td>ENG C-1001</td>
                <td>Critcal Thinking and Writing</td>
                <td>Dr. Chase Dimock</td>
            </tr>
            <tr>
                <td>CAWT 171</td>
                <td>Website Development II</td>
                <td>Marty Pfieffer</td>
            </tr>
            <tr>
                <td>SIGN 200</td>
                <td>Specialized Signs and Settings</td>
                <td>Kaylee Millar</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
