<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rose Hernandez-Bullock's Schedule</title>
    <style>
        body {
            font-size: 30px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        table {
            width: auto;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
        }

        body {
            margin: 30px;
        }

        table {
            border-collapse: separate;
            border-spacing: 0;
            min-width: 350px;
        }

        table tr th,
        table tr td {
            border-right: 7px solid #844c02;
            border-bottom: 7px solid #844c02;
            padding: 20px;
        }

        table tr th:first-child,
        table tr td:first-child {
            border-left: 7px solid #844c02;
        }

        table tr th {
            background: #edb36b;
            border-top: 7px solid #844c02;
            text-align: left;
        }

        /* top-left border-radius */
        table tr:first-child th:first-child {
            border-top-left-radius: 9px;
        }

        /* top-right border-radius */
        table tr:first-child th:last-child {
            border-top-right-radius: 9px;
        }

        /* bottom-left border-radius */
        table tr:last-child td:first-child {
            border-bottom-left-radius: 9px;
        }

        /* bottom-right border-radius */
        table tr:last-child td:last-child {
            border-bottom-right-radius: 9px;
        }
    </style>
</head>

<body>
    <header>
        <h1>Rose Hernandez-Bullock's Schedule</h1>
    </header>
    <table>
        <caption>College Course</caption>
        <tr>
            <th>Course Number</th>
            <th>Course Name</th>
            <th>Professor</th>
        </tr>
        <tr>
            <td>CAWT 170</td>
            <td>Website Development I</td>
            <td>Marty Pfieffer</td>
        </tr>
        <tr>
            <td>ENG C-1001</td>
            <td>Critcal Thinking and Writing</td>
            <td>Dr. Chase Dimock</td>
        </tr>
        <tr>
            <td>CAWT 171</td>
            <td>Website Development II</td>
            <td>Marty Pfieffer</td>
        </tr>
        <tr>
            <td>SIGN 200</td>
            <td>Specialized Signs and Settings</td>
            <td>Kaylee Millar</td>
        </tr>
    </table>
</body>

</html>
